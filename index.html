<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15336b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Pas de barre d'état transparente : sur iOS 26 elle réduit la zone d'affichage
       et laisse une bande morte en bas de l'écran (WebKit bug 301108). -->
  <meta name="apple-mobile-web-app-title" content="PdB BSPP">
  <meta name="format-detection" content="telephone=no">
  <title>Prise de bilans – Garde BSPP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="chrome" id="chrome">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">PdB</span>
      <span class="brand-name">Garde BSPP</span>
    </div>
    <button type="button" class="victim-switch" id="btn-victims" aria-haspopup="dialog" aria-controls="sheet">
      <span class="victim-dot" id="victim-dot" aria-hidden="true"></span>
      <span class="victim-label" id="victim-label">Victime 1</span>
      <span class="victim-count" id="victim-count" hidden></span>
      <span class="chev" aria-hidden="true"></span>
    </button>
  </header>

  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  </div>

  <nav class="rail" id="tabs" role="tablist" aria-orientation="vertical" aria-label="Étapes du bilan : S, X, A, B, C, D, puis complémentaire">
    <span class="rail-indicator" id="rail-indicator" aria-hidden="true"></span>
  </nav>

  <main id="main">
    <div id="panels"></div>
    <section class="panel" id="panel-bilan" role="tabpanel" hidden>
      <div class="summary" id="summary"></div>
      <div class="group">
        <p class="hint">
          Lisez le bilan à votre chef, ou envoyez-le-lui par message.
          Tout reste sur ce téléphone tant que vous ne l’envoyez pas.
        </p>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-read">Lire le bilan au chef</button>
          <button type="button" class="btn" id="btn-send">Envoyer par message</button>
          <button type="button" class="btn" id="btn-copy-all">Copier tout</button>
        </div>
        <div id="missing" class="missing" hidden></div>
      </div>

      <div id="report-sections"></div>
      <div class="end-actions">
        <button type="button" class="btn" id="btn-new-bottom">Nouvelle victime</button>
        <button type="button" class="btn danger" id="btn-delete-current">Supprimer ce bilan</button>
      </div>
    </section>
  </main>

  <footer class="bottombar">
    <button type="button" class="btn" id="btn-prev">‹ Précédent</button>
    <button type="button" class="btn primary" id="btn-next">Suivant ›</button>
  </footer>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title">Bilans en cours</h2>
        <button type="button" class="btn mini" id="btn-sheet-close">Fermer</button>
      </div>
      <ul class="victims" id="victims"></ul>
      <button type="button" class="btn primary block" id="btn-new">+ Nouvelle victime</button>
      <p class="hint small">
        Les bilans restent uniquement sur ce téléphone. Supprimez-les une fois rendus au chef.
      </p>
    </div>
  </div>

  <!-- Bilan à lire au chef : plein écran, gros caractères, une partie par bloc. -->
  <div class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
    <header class="reader-head">
      <div class="reader-title">
        <h2 id="reader-title">Bilan</h2>
        <span class="reader-sub" id="reader-sub"></span>
      </div>
      <div class="reader-zoom" role="group" aria-label="Taille du texte">
        <button type="button" class="btn mini" id="btn-zoom-out" aria-label="Texte plus petit">A−</button>
        <button type="button" class="btn mini" id="btn-zoom-in" aria-label="Texte plus grand">A+</button>
      </div>
      <button type="button" class="btn mini" id="btn-reader-close">Fermer</button>
    </header>
    <div class="reader-body" id="reader-body"></div>
    <footer class="reader-foot">
      <button type="button" class="btn" id="btn-reader-copy">Copier</button>
      <button type="button" class="btn primary" id="btn-reader-send">Envoyer par message</button>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
